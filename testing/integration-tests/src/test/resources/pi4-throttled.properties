# HomeSynapse Core — Pi 4 Equivalent Test Profile
# Loaded by IntegrationTestHarness when system property `pi.profile=throttled`.
# Values are read at @BeforeAll setup time; tests may override via individual
# system properties.

# ---------------------------------------------------------------------------
# Disk I/O simulation (consumed by M3.4b's ThrottledWriteCoordinator)
# ---------------------------------------------------------------------------
# Baseline fsync delay applied to every write operation (ms).
disk.baseline.delay.ms=10

# Spike fsync delay applied probabilistically to simulate SD-card D1 spikes (ms).
disk.spike.delay.ms=200

# Probability that any given write incurs the spike delay (0.0 - 1.0).
disk.spike.probability=0.005

# ---------------------------------------------------------------------------
# Sustained load (M3.4b — Pi4SustainedLoadIT)
# ---------------------------------------------------------------------------
# Default sustained run duration in minutes. Overridable via -PsustainedMinutes.
sustained.duration.minutes=60

# ---------------------------------------------------------------------------
# Heap budget (HeapBudgetIT)
# ---------------------------------------------------------------------------
# Hard ceiling for peak heap after full GC, in megabytes.
heap.budget.mb=256
