# HomeSynapse Core — install-smoke CI job (the gate of record).
#
# Proves the one-command install path end-to-end on every change:
#   build image → assemble .deb → install on a clean machine → boot →
#   loopback health probe → assert RUNNING + token + auth enforced →
#   stop → uninstall (data preserved) → update-smoke (zero event loss).
#
# This IS go/no-go gate #4 ("install path proven") for the mid-August review.
#
# ┌─ WIRING SEAM ────────────────────────────────────────────────────────────┐
# │ GitHub only runs workflows under .github/workflows/. This file lives in   │
# │ distribution/ci/ to honour the lane's write-isolation (the spine owns     │
# │ .github/). To activate, the hub copies/symlinks it:                       │
# │     cp distribution/ci/install-smoke.yml .github/workflows/install-smoke.yml
# │ (Or add a path-trigger to the existing ci.yml.) Flagged in the lane return.│
# └───────────────────────────────────────────────────────────────────────────┘
name: install-smoke

on:
  push:
    branches: [ main, develop ]
    paths: [ 'distribution/**', 'app/**', 'lifecycle/**', 'api/**', 'gradle/**', 'build-logic/**', '.github/workflows/install-smoke.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'distribution/**', 'app/**', 'lifecycle/**', 'api/**' ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  install-smoke:
    name: Build image + .deb, install-smoke on a clean ${{ matrix.arch }} machine
    # Two architectures, ONE instrument: both legs run the same scripts byte-for-
    # byte; only the runner differs (hs_deb_arch reads dpkg --print-architecture
    # on it). ubuntu-24.04-arm is GitHub-hosted and free for public repositories.
    # fail-fast: false — one leg's red never hides the other's verdict.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}   # hosted Ubuntu runs systemd → real service install
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'   # matches ci.yml / LTD-01 pinning
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Node 22 (dashboard packaging — installDist now builds the SPA)
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Static lint (shell scripts parse-clean + the version-grammar fixtures)
        run: |
          set -e
          for f in $(find distribution -name '*.sh'); do bash -n "$f"; done
          echo "all shell scripts parsed clean"
          # F-V1/R-V: hs_version's scheme + order and the build-image grammar regex, fixture-paired.
          bash distribution/smoke/version-grammar-test.sh
          # R-7b: every directive in the unit must be one systemd knows — an unknown key is
          # IGNORED at load, silently (LogDirectory= vs LogsDirectory=, found at R-9). On a
          # runner with no install the "Command … is not executable" lines are expected and
          # must not fail the step; only an unknown directive does. (`! grep` would not fail
          # the step under set -e — bash ignores -e for an inverted command — hence the if.)
          command -v systemd-analyze >/dev/null || { echo "::error::systemd-analyze is missing on this runner"; exit 1; }
          systemd-analyze --man=no verify distribution/systemd/homesynapse.service 2>&1 | tee /tmp/unit-verify.log
          if grep -q 'Unknown key name' /tmp/unit-verify.log; then
            echo "::error::the unit carries a directive systemd does not know (see 'Unknown key name' above)"
            exit 1
          fi
          echo "unit directives verified"

      - name: Build runtime image (Gradle installDist → jlink)
        run: distribution/image/build-image.sh

      - name: Assemble .deb
        run: distribution/deb/build-deb.sh

      - name: Arch-truth assert (.deb Architecture == ${{ matrix.arch }})
        run: |
          # passes-but-false input: an amd64 jlink image packaged under an arm64 label
          # would pass every later check on the same runner — the control field is the
          # cheapest honest discriminator; the boot in run-smoke is the second.
          DEB="$(ls -1t distribution/deb/build/homesynapse_*.deb | head -1)"
          ACTUAL="$(dpkg-deb --field "${DEB}" Architecture)"
          if [ "${ACTUAL}" != "${{ matrix.arch }}" ]; then
            echo "::error::arch-truth assert FAILED: ${DEB} carries Architecture='${ACTUAL}', this leg is '${{ matrix.arch }}'"
            exit 1
          fi
          echo "arch-truth assert green: ${DEB} Architecture=${ACTUAL} == matrix.arch=${{ matrix.arch }}"

      - name: Version-grammar echo (hs_version is tag-shaped; the .deb carries it)
        run: |
          # The same regex build-image.sh asserts at its capture site — one instrument,
          # two rigs (copy, don't retype; version-grammar-test.sh pins the three carriers).
          # HS_DIST_DIR pins the lookup dir exactly as the build scripts pass it.
          V="$(HS_DIST_DIR=distribution bash -c '. "distribution/common.sh"; hs_version')"
          echo "hs_version=${V}"
          printf '%s' "${V}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::version of record '${V}' is not tag-shaped (expected ^[0-9]+\.[0-9]+\.[0-9]+)"; exit 1; }
          # The git-less fallback is tag-shaped and Debian-safe, so it passes the regex — the
          # passes-but-false input. In CI it is never lawful: actions/checkout leaves .git.
          [ "${V}" != "0.1.0-skeleton" ] \
            || { echo "::error::version of record is the git-less fallback '0.1.0-skeleton' — never lawful in CI (actions/checkout leaves .git)"; exit 1; }
          DEB="$(ls -1t distribution/deb/build/homesynapse_*.deb | head -1)"
          STAMPED="$(dpkg-deb --field "${DEB}" Version)"
          IMAGE_STAMP="$(cat distribution/image/build/opt/homesynapse/VERSION)"
          printf '%s' "${STAMPED}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' \
            || { echo "::error::${DEB} carries Version='${STAMPED}', which is not tag-shaped"; exit 1; }
          [ "${STAMPED}" = "${IMAGE_STAMP}" ] \
            || { echo "::error::${DEB} carries Version='${STAMPED}' but the image VERSION file says '${IMAGE_STAMP}'"; exit 1; }
          [ "${STAMPED}" = "${V}" ] \
            || echo "::warning::hs_version now says '${V}' but the build stamped '${STAMPED}' — the tree changed between build and echo (a -dirty suffix?)"
          # The .deb's sha256 is the origin hash the install packets compare their desktop
          # and card copies against — the artifact channel is hash-verifiable from this log.
          DEB_SHA="$(sha256sum "${DEB}" | cut -c1-64)"
          echo "version-grammar echo green: ${V} (scheme 0.1.0+git<YYYYMMDD.HHMMSS>.g<sha>; .deb Version=${STAMPED}; image VERSION=${IMAGE_STAMP}; sha256 ${DEB_SHA}  ${DEB##*/})"

      - name: Install smoke prerequisites (sqlite3)
        run: |
          # sqlite3 backs run-smoke's event write-path row-count probe (R-1).
          # update-smoke's own install below stays for step self-sufficiency.
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3

      - name: Install-smoke (install → boot → probe → assert → uninstall)
        run: sudo --preserve-env=JAVA_HOME distribution/smoke/run-smoke.sh

      - name: Update-smoke (version bump preserves the event store)
        run: |
          # sqlite3 enables the hard zero-event-loss row-count assertion.
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
          sudo --preserve-env=JAVA_HOME distribution/update/update-smoke.sh

      - name: Upload artifacts (image, .deb, logs)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: distribution-artifacts-${{ matrix.arch }}
          path: |
            distribution/image/build/homesynapse_*.tar.gz
            distribution/deb/build/homesynapse_*.deb
          retention-days: 7

      - name: Capture service journal on failure
        if: failure()
        run: |
          sudo journalctl -u homesynapse.service -b --no-pager || true
          sudo systemctl --no-pager status homesynapse.service || true
